name: watch-dm
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  # Core
  - pandas>=2.0
  - numpy>=1.24
  - pyarrow>=14.0
  # Stats
  - scipy>=1.11
  - statsmodels>=0.14
  - scikit-learn>=1.3
  # Visualization
  - matplotlib>=3.7
  - seaborn>=0.13
  - plotly>=5.18
  # Notebook
  - jupyterlab>=4.0
  - ipykernel>=6.25
  # Utilities
  - pyyaml>=6.0
  - tqdm>=4.66
  - python-dotenv>=1.0
  # Pip-only packages
  - pip
  - pip:
      - lifelines>=0.27
      - pingouin>=0.5
